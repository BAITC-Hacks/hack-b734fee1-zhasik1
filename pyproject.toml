[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qor-hackalem-mvp"
version = "0.1.0"
description = "QOR explainable supplier replenishment"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "streamlit>=1.57",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "plotly>=5,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

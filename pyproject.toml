[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qor-hackalem-mvp"
version = "0.1.0"
description = "QOR explainable supplier replenishment"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic==2.13.5",
  "streamlit==1.64.0",
  "pandas==2.3.3",
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "plotly==7.1.0",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
